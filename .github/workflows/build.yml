name: Build Xiaomi 11T Pro Kernel (Android 15-17 & HyperOS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel with Clang 17+ & eBPF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Clang 17
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses-dev libncurses6 libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev tar wget binutils-aarch64-linux-gnu
          
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y lld-17 llvm-17 clang-17

          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            sudo ln -sf /usr/bin/${tool}-17 /usr/bin/${tool} || true
          done

          sudo ln -sf /usr/bin/ld.lld-17 /usr/bin/aarch64-linux-gnu-ld || true
          sudo ln -sf /usr/bin/llvm-ar-17 /usr/bin/aarch64-linux-gnu-ar || true
          sudo ln -sf /usr/bin/llvm-nm-17 /usr/bin/aarch64-linux-gnu-nm || true
          sudo ln -sf /usr/bin/llvm-objcopy-17 /usr/bin/aarch64-linux-gnu-objcopy || true

      - name: Cherry-pick AOSP eBPF Patches
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git remote add aosp-common https://android.googlesource.com/kernel/common || true
          git fetch aosp-common android12-5.4 --depth=100

          COMMIT1=$(git log --grep="bpf: add bpf_ringbuf support" aosp-common/android12-5.4 -n 1 --pretty=format:"%H")
          COMMIT2=$(git log --grep="bpf: Add bpf_sk_storage" aosp-common/android12-5.4 -n 1 --pretty=format:"%H")

          if [ -n "$COMMIT1" ]; then
            git cherry-pick $COMMIT1 || git cherry-pick --abort || true
          fi

          if [ -n "$COMMIT2" ]; then
            git cherry-pick $COMMIT2 || git cherry-pick --abort || true
          fi

      - name: Setup KernelSU (v0.9.5 Legacy for 5.4)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          mkdir -p out
          
          CONF_TARGET=$(find arch/arm64/configs -type f \( -name "*lahaina*defconfig*" -o -name "*gki_defconfig*" -o -name "*vili*defconfig*" \) | head -n 1)
          if [ -z "$CONF_TARGET" ]; then
            CONF_TARGET="arch/arm64/configs/defconfig"
          fi
          
          echo "Selected configuration target: $CONF_TARGET"
          cp "$CONF_TARGET" out/.config

          find arch/arm64/configs -type f -name "*vili*.config" | while read -r frag; do
            echo "Merging fragment: $frag"
            scripts/kconfig/merge_config.sh -m -O out out/.config "$frag"
          done

          # Suppress strict Clang 17 warnings and errors
          scripts/config --file out/.config -d WERROR
          scripts/config --file out/.config -e QCOM_SCM
          scripts/config --file out/.config --set-val FRAME_WARN 4096

          # Enable Subsystem Restart and Peripheral Loader drivers
          scripts/config --file out/.config -e MSM_SUBSYSTEM_RESTART
          scripts/config --file out/.config -e MSM_SYSMON_QMI_COMM
          scripts/config --file out/.config -e MSM_PIL
          scripts/config --file out/.config -e MSM_PIL_SSR_GENERIC
          scripts/config --file out/.config -e QTI_GVM_QUIN_COMMON

          # Disable Neuron channel drivers to eliminate undefined hh_* linker symbols
          scripts/config --file out/.config -d NEURON
          scripts/config --file out/.config -d NET_NEURON
          scripts/config --file out/.config -d QTI_NEURON

          # Keep Minidump enabled to satisfy symbols required by trace.c and ipc_logging.c
          scripts/config --file out/.config -e MSM_MINIDUMP

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error -w -Wno-error=incompatible-function-pointer-types" olddefconfig
          
          # Compile uncompressed raw kernel Image
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error -w -Wno-error=incompatible-function-pointer-types" Image || make -j1 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error -w -Wno-error=incompatible-function-pointer-types" V=1 Image

      - name: Prepare AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=vili/g' AnyKernel3/anykernel.sh

          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          fi

          find out/arch/arm64/boot -name "*.dtb" -exec cp {} AnyKernel3/dtb \; || true

          cd AnyKernel3
          zip -r9 ../NextGen-Kernel-vili-A15-A17.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Kernel-vili-A15-A17
          path: NextGen-Kernel-vili-A15-A17.zip
