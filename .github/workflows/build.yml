name: Build Xiaomi Official Vili Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by FrenkyMahn
    runs-on: ubuntu-20.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: vili-r-oss
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm zip git curl

      - name: Integrate KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Download Clang Toolchain
        run: |
          mkdir clang
          cd clang
          curl -LO "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          tar -xf clang-r416183b.tar.gz
          cd ..

      - name: Configure Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- vili_QGKI.config
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- olddefconfig

      - name: Compile Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- \
            Image \
            modules

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf anykernel.sh
          
          cat << 'EOF' > anykernel.sh
          properties() { '
          kernel.string=Vili Official Port Kernel by FrenkyMahn
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=vili_in
          device.name3=vili_global
          device.name4=enuma
          device.name5=elish
          supported.versions=11-15
          '; }

          # Shell Variables (Capitalized Standard)
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # Core initialization
          . tools/ak3-core.sh;
          reset_ak;

          # Flash kernel directly to active boot partition
          split_boot;
          flash_boot;
          EOF

          cp ../out/arch/arm64/boot/Image Image
          zip -r9 ../Vili_Kernel_Port_Fixed.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vili-Kernel-Port-Fixed
          path: Vili_Kernel_Port_Fixed.zip
