name: Build Xiaomi 11T Pro Kernel (Android 15-17 & HyperOS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel with Clang 17+ & eBPF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf liblz4-tool libncurses-dev libncurses6 libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Cherry-pick AOSP eBPF Patches
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git remote add aosp-common https://android.googlesource.com/kernel/common || true
          git fetch aosp-common android12-5.4 --depth=100

          COMMIT1=$(git log --grep="bpf: add bpf_ringbuf support" aosp-common/android12-5.4 -n 1 --pretty=format:"%H")
          COMMIT2=$(git log --grep="bpf: Add bpf_sk_storage" aosp-common/android12-5.4 -n 1 --pretty=format:"%H")

          if [ -n "$COMMIT1" ]; then
            git cherry-pick $COMMIT1 || git cherry-pick --abort || true
          fi

          if [ -n "$COMMIT2" ]; then
            git cherry-pick $COMMIT2 || git cherry-pick --abort || true
          fi

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Download Clang 17+
        run: |
          git clone --depth=1 https://github.com/llvm/llvm-project.git -b llvmorg-17.0.6 clang_src || true
          mkdir -p clang
          curl -LO "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r486374.tar.gz"
          tar -C clang/ -xf clang-r486374.tar.gz || git clone --depth=1 https://github.com/ZyCromerZ/google-clang.git -b 17 clang

      - name: Build Kernel Image & DTB
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out ARCH=arm64 vendor/vili_GKI.config vendor/vili_QGKI.config

          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image.gz dtb

      - name: Prepare AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=vili/g' AnyKernel3/anykernel.sh

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi

          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/dtb \; || true

          cd AnyKernel3
          zip -r9 ../NextGen-Kernel-vili-A15-A17.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Kernel-vili-A15-A17
          path: NextGen-Kernel-vili-A15-A17.zip
