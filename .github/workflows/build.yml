name: Build Kernel - Xiaomi 11T Pro (vili)

on:
  workflow_dispatch:
  push:
    branches:
      - vili-r-oss

jobs:
  build:
    name: Build Kernel Image & AnyKernel3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: vili-r-oss
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt update -y
          sudo apt install -y git ccache automake flex lzop bison \
            bc build-essential libelf-dev libssl-dev libfl-dev \
            squashfs-tools python3 python-is-python3 device-tree-compiler \
            binutils-aarch64-linux-gnu

      - name: Download Toolchains (Clang & GCC)
        run: |
          mkdir -p toolchain
          cd toolchain
          # Download Google Clang from official Android Git
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release clang-repo
          mkdir -p clang
          cp -r clang-repo/clang-r416183b/* clang/ 2>/dev/null || cp -r clang-repo/* clang/
          rm -rf clang-repo

          # Download GCC
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchain/clang/bin:${{ github.workspace }}/toolchain/gcc64/bin:${{ github.workspace }}/toolchain/gcc32/bin:$PATH"

          KBUILD_COMPILER_STRING="$(${{ github.workspace }}/toolchain/clang/bin/clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g')"
          export KBUILD_COMPILER_STRING

          # 1. Generate defconfig using existing repository configs
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            vendor/lahaina_QGKI.config vendor/vili_QGKI.config

          # 2. Compile Kernel
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz-dtb dtbo.img

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/BLOCK=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/g' AnyKernel3/anykernel.sh

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

          cd AnyKernel3
          zip -r9 ../AnyKernel3-vili-NextGen.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-vili-NextGen
          path: AnyKernel3-vili-NextGen.zip
