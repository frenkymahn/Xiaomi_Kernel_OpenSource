name: Build Xiaomi Official Vili Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex \
            libelf-dev libfl-dev git curl wget zip unzip python3 python-is-python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup Clang (AOSP r416183b)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release clang-repo
          mkdir -p $GITHUB_WORKSPACE/clang
          cp -r clang-repo/clang-r416183b/* $GITHUB_WORKSPACE/clang/
          rm -rf clang-repo

      - name: Integrate KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Configure Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          mkdir -p out
          
          # Base GKI + Vili Config
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            cat arch/arm64/configs/gki_defconfig arch/arm64/configs/vendor/vili_QGKI.config > out/.config
          else
            cp arch/arm64/configs/vendor/vili_QGKI.config out/.config
          fi

          # Disable 32-bit vDSO
          scripts/config --file out/.config --disable COMPAT_VDSO
          scripts/config --file out/.config --disable VDSO32

          # Fix QCOM Core SMEM & Bus Errors
          scripts/config --file out/.config --enable CONFIG_QCOM_SMEM
          scripts/config --file out/.config --disable CONFIG_I3C
          scripts/config --file out/.config --disable CONFIG_I3C_MASTER_MSM_GENI

          make O=out ARCH=arm64 olddefconfig

      - name: Compile vili-r-oss GKI Image
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Compile GKI Kernel Image
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3

          # Copy GKI Kernel Image
          cp out/arch/arch/boot/Image AnyKernel3/Image 2>/dev/null || cp out/arch/arm64/boot/Image AnyKernel3/Image

          # AnyKernel3 Flashing Setup with VBMETA Patching for Port ROMs
          cat << 'EOF' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=Port ROM Ready GKI Kernel with KernelSU for Xiaomi 11T Pro
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=Xiaomi 11T Pro
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          . tools/ak3-core.sh;

          # Flash GKI Image directly to boot partition with VBMETA bypass
          BLOCK=boot;
          is_slot_device=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          split_boot;
          flash_boot;
          EOF

          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-KernelSU.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-KernelSU
          path: Xiaomi-11T-Pro-KernelSU.zip
