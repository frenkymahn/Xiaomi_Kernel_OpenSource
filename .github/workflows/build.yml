name: Build Xiaomi 11T Pro Kernel (Android 15-17 & HyperOS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel with Clang 17+ & eBPF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Clang 17
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf liblz4-tool libncurses-dev libncurses6 libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev tar wget binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y lld-17 llvm-17

      - name: Cherry-pick AOSP eBPF Patches
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git remote add aosp-common https://android.googlesource.com/kernel/common || true
          git fetch aosp-common android12-5.4 --depth=100

          COMMIT1=$(git log --grep="bpf: add bpf_ringbuf support" aosp-common/android12-5.4 -n 1 --pretty=format:"%H")
          COMMIT2=$(git log --grep="bpf: Add bpf_sk_storage" aosp-common/android12-5.4 -n 1 --pretty=format:"%H")

          if [ -n "$COMMIT1" ]; then
            git cherry-pick $COMMIT1 || git cherry-pick --abort || true
          fi

          if [ -n "$COMMIT2" ]; then
            git cherry-pick $COMMIT2 || git cherry-pick --abort || true
          fi

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build Kernel Image & DTB
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang-17
          export LD=ld.lld-17
          export AR=llvm-ar-17
          export NM=llvm-nm-17
          export OBJCOPY=llvm-objcopy-17
          export OBJDUMP=llvm-objdump-17
          export READELF=llvm-readelf-17
          export STRIP=llvm-strip-17
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang-17 LD=ld.lld-17 vendor/lahaina-qgki_defconfig || make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang-17 LD=ld.lld-17 vendor/lahaina_defconfig

          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/vili_GKI.config arch/arm64/configs/vendor/vili_QGKI.config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang-17 LD=ld.lld-17 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang-17 LD=ld.lld-17 Image.gz dtb

      - name: Prepare AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=vili/g' AnyKernel3/anykernel.sh

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi

          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/dtb \; || true

          cd AnyKernel3
          zip -r9 ../NextGen-Kernel-vili-A15-A17.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Kernel-vili-A15-A17
          path: NextGen-Kernel-vili-A15-A17.zip
