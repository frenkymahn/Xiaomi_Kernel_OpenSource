name: Build Xiaomi 11T Pro Kernel (Android 15-17 & HyperOS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel with Clang 17+ & eBPF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Clang 17
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses-dev libncurses6 libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev tar wget binutils-aarch64-linux-gnu
          
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y lld-17 llvm-17 clang-17

          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            sudo ln -sf /usr/bin/${tool}-17 /usr/bin/${tool} || true
          done

          sudo ln -sf /usr/bin/ld.lld-17 /usr/bin/aarch64-linux-gnu-ld || true
          sudo ln -sf /usr/bin/llvm-ar-17 /usr/bin/aarch64-linux-gnu-ar || true
          sudo ln -sf /usr/bin/llvm-nm-17 /usr/bin/aarch64-linux-gnu-nm || true
          sudo ln -sf /usr/bin/llvm-objcopy-17 /usr/bin/aarch64-linux-gnu-objcopy || true

      - name: Cherry-pick AOSP eBPF Patches
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git remote add aosp-common https://android.googlesource.com/kernel/common || true
          git fetch aosp-common android12-5.4 --depth=100

          COMMIT1=$(git log --grep="bpf: add bpf_ringbuf support" aosp-common/android12-5.4 -n 1 --pretty=format:"%H")
          COMMIT2=$(git log --grep="bpf: Add bpf_sk_storage" aosp-common/android12-5.4 -n 1 --pretty=format:"%H")

          if [ -n "$COMMIT1" ]; then
            git cherry-pick $COMMIT1 || git cherry-pick --abort || true
          fi

          if [ -n "$COMMIT2" ]; then
            git cherry-pick $COMMIT2 || git cherry-pick --abort || true
          fi

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Fix Linux 5.4 header compatibility in KernelSU
          find drivers/kernelsu -type f -name "*.c" -o -name "*.h" | xargs sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g'

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
