name: Build Xiaomi Official Vili Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official Xiaomi Source
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex \
            libelf-dev libfl-dev git curl wget zip unzip python3 python-is-python3 \
            device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Setup Clang (AOSP r416183b)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release clang-repo
          mkdir -p $GITHUB_WORKSPACE/clang
          cp -r clang-repo/clang-r416183b/* $GITHUB_WORKSPACE/clang/
          rm -rf clang-repo

      - name: Merge Xiaomi Vili Defconfig
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          mkdir -p out
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/lahaina-qgki_defconfig \
            arch/arm64/configs/vendor/vili_QGKI.config
          make O=out ARCH=arm64 savedefconfig || true

      - name: Compile Official Vili Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # Build Image and Xiaomi DTBs
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image dtbs

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3

          # 1. Copy Kernel Image
          cp out/arch/arm64/boot/Image AnyKernel3/Image

          # 2. Pick Official Vili Lahaina DTB (2-3 MB)
          if [ -f out/arch/arm64/boot/dts/vendor/qcom/lahaina-v2.dtb ]; then
            cp out/arch/arm64/boot/dts/vendor/qcom/lahaina-v2.dtb AnyKernel3/dtb
          elif [ -f out/arch/arm64/boot/dts/vendor/qcom/lahaina.dtb ]; then
            cp out/arch/arm64/boot/dts/vendor/qcom/lahaina.dtb AnyKernel3/dtb
          else
            find out/arch/arm64/boot/dts/vendor/qcom/ -name "*lahaina*.dtb" | head -n 1 | xargs -I {} cp {} AnyKernel3/dtb
          fi

          # 3. Create Xiaomi Official DTBO Image using dtc
          find out/arch/arm64/boot/dts/vendor/qcom/ -name "*vili*.dtbo" -o -name "*overlay*.dtbo" > dtbo_list.txt || true
          if [ -s dtbo_list.txt ]; then
            git clone --depth=1 https://android.googlesource.com/platform/system/libufdt libufdt
            python3 libufdt/utils/src/mkdtboimg.py create AnyKernel3/dtbo.img $(cat dtbo_list.txt) || true
          fi

          # 4. AnyKernel3 Flashing Setup for Port ROMs
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Official Base Kernel for Xiaomi 11T Pro (vili)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=Xiaomi 11T Pro
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          . tools/ak3-core.sh;

          # Flash Kernel & SoC DTB
          BLOCK=boot;
          is_slot_device=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          split_boot;
          flash_boot;

          # Flash Official DTBO (Display, 120Hz & Touch)
          if [ -f dtbo.img ]; then
            BLOCK=dtbo;
            is_slot_device=auto;
            reset_ak;
            flash_boot;
          fi;

          # Preserve Vendor Boot
          BLOCK=vendor_boot;
          is_slot_device=auto;
          reset_ak;
          split_boot;
          flash_boot;
          EOF

          # 5. Zip Artifact
          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-Official-Kernel.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-Official-Kernel
          path: Xiaomi-11T-Pro-Official-Kernel.zip
